name: Add Research Audit Provenance Explorer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Patch app navigation and route
        shell: python
        run: |
          from pathlib import Path
          p=Path("app.py")
          t=p.read_text(encoding="utf-8")
          nav='("🔍 Research Audit & Provenance Explorer","nav_audit_provenance")'
          for anchor in ['("🎯 Research Decision Center","nav_decision_center")','("🔗 Research Evidence Graph","nav_evidence_graph")']:
              if nav not in t and anchor in t:
                  t=t.replace(anchor,anchor+',\n        '+nav,1)
                  break
          if nav not in t: raise SystemExit("navigation anchor not found")
          route='elif section=="🔍 Research Audit & Provenance Explorer":\n        import runpy\n        runpy.run_path("pages/39_Research_Audit_Provenance_Explorer.py")\n        st.stop()\n    '
          if 'pages/39_Research_Audit_Provenance_Explorer.py' not in t:
              for anchor in ['elif section=="🎯 Research Decision Center":','elif section=="🔗 Research Evidence Graph":']:
                  if anchor in t:
                      t=t.replace(anchor,route+anchor,1)
                      break
              else: raise SystemExit("route anchor not found")
          p.write_text(t,encoding="utf-8")
      - name: Syntax check
        run: python -m py_compile app.py pages/39_Research_Audit_Provenance_Explorer.py
      - name: Commit integration
        run: |
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate Research Audit Provenance Explorer"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
