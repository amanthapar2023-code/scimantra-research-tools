name: Add H2S publication dashboard navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add navigation and renderer
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path("app.py")
          text = p.read_text(encoding="utf-8")

          nav_marker = '("Experimental Design Power Analysis","nav_power")'
          nav_add = nav_marker + ',("🧪 H₂S Publication Dashboard","nav_h2s_publication")'
          if 'nav_h2s_publication' not in text:
              text = text.replace(nav_marker, nav_add, 1)

          render_marker = 'elif section=="📈 Data Analyzer":\n    from src.scimantra.data_ui import render as render_data_ui; render_data_ui()'
          render_add = render_marker + '\n\nelif section=="🧪 H₂S Publication Dashboard":\n    import runpy\n    runpy.run_path("pages/22_H2S_Publication_Results_Dashboard.py")'
          if 'section=="🧪 H₂S Publication Dashboard"' not in text:
              if render_marker not in text:
                  raise SystemExit("Data Analyzer navigation insertion point not found")
              text = text.replace(render_marker, render_add, 1)

          p.write_text(text, encoding="utf-8")
      - name: Syntax check
        run: |
          python -m py_compile app.py
          python -m py_compile pages/22_H2S_Publication_Results_Dashboard.py
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Add H2S publication dashboard navigation'
          git push
