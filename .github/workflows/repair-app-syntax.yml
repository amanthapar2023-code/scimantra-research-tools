name: Repair dashboard syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair known dashboard typo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('f"{r.pvalue:.6g")', 'f"{r.pvalue:.6g}")')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          python -m py_compile app.py
          find src pages billing -name '*.py' -print0 | xargs -0 -n1 python -m py_compile
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Repair dashboard syntax'
          git push
