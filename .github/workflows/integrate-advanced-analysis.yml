name: Integrate advanced analysis navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'Integrate advanced analysis navigation') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '"📈 Data Analyzer", "🔬 Research Tools", "🌍 TEA & LCA"'
          new = '"📈 Data Analyzer", "📊 Advanced Experimental Data Analysis", "🔬 Research Tools", "🌍 TEA & LCA"'
          if old not in s:
              raise SystemExit('Expected navigation pattern was not found; no change made.')
          s = s.replace(old, new, 1)
          marker = 'elif section == "📊 Advanced Experimental Data Analysis":\n    import runpy\n    runpy.run_path("pages/7_Advanced_Experimental_Data_Analysis.py")\n'
          if marker not in s:
              anchor = 'def download_df(df, filename="scimantra_results.csv"):'
              insert = '\n' + marker + '\n'
              # Add a branch immediately before the first calculator branch.
              branch_anchor = 'if section == "🏠 Dashboard":'
              s = s.replace(branch_anchor, marker + '\n' + branch_anchor, 1)
          p.write_text(s, encoding='utf-8')

      - name: Syntax check
        run: python -m py_compile app.py

      - name: Commit integration and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm .github/workflows/integrate-advanced-analysis.yml
          git commit -m "Integrate advanced analysis navigation"
          git push
