name: Normalize Streamlit width API

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize-width-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace deprecated Streamlit width arguments and fix page embedding
        shell: python
        run: |
          from pathlib import Path
          changed = []
          for p in Path('.').rglob('*.py'):
              if '.git' in p.parts:
                  continue
              s = p.read_text(encoding='utf-8')
              new = s.replace('use_container_width=True', 'width="stretch"').replace('use_container_width=False', 'width="content"')
              if p.as_posix() == 'pages/7_Advanced_Experimental_Data_Analysis.py':
                  duplicate = 'st.set_page_config(page_title="H₂S Research Analysis Suite", page_icon="📊", layout="wide")\n\n'
                  new = new.replace(duplicate, '', 1)
              if new != s:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))
          print('Updated:', changed)

      - name: Syntax check Python files
        shell: bash
        run: |
          set -e
          find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 -n1 python -m py_compile

      - name: Commit normalized files when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No normalization changes needed.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.py' '.github/workflows/integrate-advanced-analysis.yml'
          git commit -m "Fix embedded advanced analysis page config"
          git push
