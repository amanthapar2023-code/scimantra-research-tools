name: Apply advanced analysis sidebar label

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-label:
    if: ${{ !contains(github.event.head_commit.message, 'Apply short advanced analysis label') && !contains(github.event.head_commit.message, 'Advanced Analysis') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update sidebar label
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '"📊 Advanced Experimental Data Analysis"'
          new = '"📊 Advanced Analysis"'
          if old not in s:
              raise SystemExit('Advanced Experimental Data Analysis label was not found.')
          p.write_text(s.replace(old, new), encoding='utf-8')

      - name: Syntax check
        run: python -m py_compile app.py

      - name: Commit direct app update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm .github/workflows/integrate-advanced-analysis.yml
          git commit -m "Apply short advanced analysis label"
          git push
