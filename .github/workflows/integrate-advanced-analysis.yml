name: Integrate advanced analysis navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, 'Shorten advanced analysis sidebar label') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shorten sidebar label
        shell: python
        run: |
          from pathlib import Path
          p = Path('app.py')
          s = p.read_text(encoding='utf-8')
          old = '"📊 Advanced Experimental Data Analysis"'
          new = '"📊 Advanced Analysis"'
          if old not in s:
              raise SystemExit('Expected advanced analysis sidebar label was not found; no change made.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Syntax check
        run: python -m py_compile app.py

      - name: Commit integration and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm .github/workflows/integrate-advanced-analysis.yml
          git commit -m "Shorten advanced analysis sidebar label"
          git push
