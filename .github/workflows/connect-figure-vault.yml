name: Connect H2S Figure Set to Artifact Vault

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add direct Vault save to Figure Set
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pages/29_H2S_Automatic_Publication_Figure_Set.py')
          t = p.read_text(encoding='utf-8')
          t = t.replace('st.set_page_config(page_title="H₂S Publication Figure Set", page_icon="📚", layout="wide")\n\n', '')
          old = 'from src.scimantra.research_session import get_dataframe\n'
          new = '''from src.scimantra.research_session import get_dataframe\nfrom src.scimantra.cloud import client, configured, create_artifact, upload_project_file\n\n'''
          if 'from src.scimantra.cloud import client' not in t:
              t = t.replace(old, new, 1)
          marker = '    st.download_button("📦 Download complete Figure 1–6 ZIP", package.getvalue(), "H2S_publication_figure_set.zip", "application/zip")\n'
          insert = '''    st.download_button("📦 Download complete Figure 1–6 ZIP", package.getvalue(), "H2S_publication_figure_set.zip", "application/zip")\n\n    st.markdown("### ☁️ Save directly to Research Artifact Vault")\n    st.caption("Save the generated publication package to a cloud research project with a SHA-256 fingerprint and provenance metadata. Your raw dataset is not modified.")\n    if configured(st.secrets):\n        supa = client(st.secrets)\n        try:\n            user = supa.auth.get_user().user\n        except Exception:\n            user = None\n        if user:\n            projects = supa.table("projects").select("id,name").order("updated_at", desc=True).execute().data or []\n            if projects:\n                project_map = {p["name"]: p["id"] for p in projects}\n                project_name = st.selectbox("Project for Vault save", list(project_map), key="figure_vault_project")\n                source_note = st.text_input("Provenance note", value="Generated by H₂S Automatic Publication Figure Set", key="figure_vault_note")\n                if st.button("☁️ Save Figure Set to Project Vault", type="primary", key="save_figure_vault"):\n                    try:\n                        payload = package.getvalue()\n                        digest = __import__('hashlib').sha256(payload).hexdigest()\n                        path = upload_project_file(supa, str(user.id), project_map[project_name], "H2S_publication_figure_set.zip", payload, "application/zip")\n                        create_artifact(supa, str(user.id), project_map[project_name], "H2S_publication_figure_set.zip", "package", path, "application/zip", len(payload), digest, "H₂S Automatic Publication Figure Set", {"source_dataset": source, "raw_rows": int(len(df)), "figure_count": int(len(metadata)), "note": source_note, "created_utc": datetime.now(timezone.utc).isoformat()})\n                        st.success(f"Saved the complete Figure Set to **{project_name}**.")\n                    except Exception as exc:\n                        st.error(f"Could not save to Artifact Vault: {exc}")\n            else:\n                st.info("No cloud research projects found. Create one in Cloud Project Workspace first.")\n        else:\n            st.info("Sign in to Cloud Account to enable direct Vault saving.")\n    else:\n        st.caption("Direct Vault saving becomes available after Supabase Cloud is configured.")\n'''
          if 'save_figure_vault' not in t and marker in t:
              t = t.replace(marker, insert, 1)
          p.write_text(t, encoding='utf-8')
          import ast
          ast.parse(t)
          print('Figure Set direct Vault save integrated and syntax validated.')
          PY
      - name: Commit and push safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/29_H2S_Automatic_Publication_Figure_Set.py
          git diff --cached --quiet || git commit -m 'Connect H2S figure set to Artifact Vault'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
