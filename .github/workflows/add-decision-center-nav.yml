name: Add Research Decision Center

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Patch app navigation and route
        shell: python
        run: |
          from pathlib import Path
          p = Path("app.py")
          t = p.read_text(encoding="utf-8")
          nav='("🎯 Research Decision Center","nav_decision_center")'
          anchors=['("🔗 Research Evidence Graph","nav_evidence_graph")','("🧭 Research Project Dashboard 2.0","nav_project_dashboard_2")']
          if nav not in t:
              for a in anchors:
                  if a in t:
                      t=t.replace(a,a+',\n        '+nav,1)
                      break
              else: raise SystemExit("navigation anchor not found")
          route='elif section=="🎯 Research Decision Center":\n        import runpy\n        runpy.run_path("pages/38_Research_Decision_Center.py")\n        st.stop()\n    '
          if 'pages/38_Research_Decision_Center.py' not in t:
              anchors=['elif section=="🔗 Research Evidence Graph":','elif section=="🧭 Research Project Dashboard 2.0":']
              for a in anchors:
                  if a in t:
                      t=t.replace(a,route+a,1)
                      break
              else: raise SystemExit("route anchor not found")
          p.write_text(t,encoding="utf-8")
      - name: Syntax check
        run: python -m py_compile app.py pages/38_Research_Decision_Center.py
      - name: Commit integration
        run: |
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate Research Decision Center"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
