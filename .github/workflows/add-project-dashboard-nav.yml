name: Add Research Project Dashboard 2.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Integrate dashboard navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path("app.py")
          text = p.read_text(encoding="utf-8")
          nav = '("🧭 Research Project Dashboard 2.0","nav_project_dashboard_2")'
          anchor = '("🧭 Research Evidence Timeline","nav_evidence_timeline")'
          if nav not in text:
              if anchor in text:
                  text = text.replace(anchor, anchor + ",\n        " + nav, 1)
              else:
                  anchor = '("🧬 Replicate-Aware Statistical Validation","nav_replicate_validation")'
                  if anchor in text:
                      text = text.replace(anchor, anchor + ",\n        " + nav, 1)
                  else:
                      raise SystemExit("Navigation anchor not found")
          route = 'elif section=="🧭 Research Project Dashboard 2.0":\n        import runpy\n        runpy.run_path("pages/36_Research_Project_Dashboard_2.py")\n        st.stop()\n    '
          if 'runpy.run_path("pages/36_Research_Project_Dashboard_2.py")' not in text:
              route_anchor = 'elif section=="🧭 Research Evidence Timeline":'
              if route_anchor in text:
                  text = text.replace(route_anchor, route + route_anchor, 1)
              else:
                  route_anchor = 'elif section=="🧬 Replicate-Aware Statistical Validation":'
                  if route_anchor in text:
                      text = text.replace(route_anchor, route + route_anchor, 1)
                  else:
                      raise SystemExit("Route anchor not found")
          p.write_text(text, encoding="utf-8")

      - name: Syntax check
        run: |
          python -m py_compile app.py pages/36_Research_Project_Dashboard_2.py

      - name: Commit integration
        run: |
          git add app.py
          if git diff --cached --quiet; then
            echo "No navigation changes needed."
            exit 0
          fi
          git commit -m "Integrate Research Project Dashboard 2.0"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
