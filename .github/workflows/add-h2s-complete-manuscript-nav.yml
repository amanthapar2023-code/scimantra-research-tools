name: Add H2S Complete Manuscript Builder Navigation
on:
  push:
    branches: [main]
    paths:
      - 'pages/24_H2S_Complete_Manuscript_Builder.py'
      - '.github/workflows/add-h2s-complete-manuscript-nav.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch app navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text(encoding='utf-8')
          item='("H₂S Complete Manuscript Builder", "nav_h2s_manuscript")'
          if item not in s:
              anchors=['("H₂S Manuscript Studio", "nav_h2s_studio")','("H₂S Publication Results", "nav_h2s_publication")']
              anchor=next((a for a in anchors if a in s),None)
              if anchor:
                  s=s.replace(anchor, anchor+',\n        '+item,1)
              else:
                  marker='PRO RESEARCH SUITE'
                  if marker in s:
                      s=s.replace(marker, marker+'\n        '+item,1)
          route='''elif section=="H₂S Complete Manuscript Builder":\n        import runpy; runpy.run_path("pages/24_H2S_Complete_Manuscript_Builder.py")'''
          if 'pages/24_H2S_Complete_Manuscript_Builder.py' not in s:
              candidates=['elif section=="H₂S Manuscript Studio":','elif section=="H₂S Publication Results":']
              anchor=next((c for c in candidates if c in s),None)
              if anchor:
                  pos=s.find(anchor)
                  s=s[:pos]+route+'\n    '+s[pos:]
              else:
                  s += '\n\n'+route+'\n'
          p.write_text(s,encoding='utf-8')
          compile('app.py','app.py','exec')
          compile('pages/24_H2S_Complete_Manuscript_Builder.py','pages/24_H2S_Complete_Manuscript_Builder.py','exec')
          PY
      - name: Commit patch
        run: |
          git config user.name 'scimantra-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet || git commit -m 'Wire H2S complete manuscript builder into app'
          git push
