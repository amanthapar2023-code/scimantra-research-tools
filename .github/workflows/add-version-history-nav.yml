name: Add Research Activity Version History

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Patch app navigation and route
        shell: python
        run: |
          from pathlib import Path
          p=Path("app.py")
          t=p.read_text(encoding="utf-8")
          nav='("🕒 Research Activity & Version History","nav_version_history")'
          anchors=['("🔍 Research Audit & Provenance Explorer","nav_audit_provenance")','("🎯 Research Decision Center","nav_decision_center")']
          if nav not in t:
              for a in anchors:
                  if a in t:
                      t=t.replace(a,a+',\n        '+nav,1)
                      break
              else: raise SystemExit("navigation anchor not found")
          route='elif section=="🕒 Research Activity & Version History":\n        import runpy\n        runpy.run_path("pages/40_Research_Activity_Version_History.py")\n        st.stop()\n    '
          if 'pages/40_Research_Activity_Version_History.py' not in t:
              anchors=['elif section=="🔍 Research Audit & Provenance Explorer":','elif section=="🎯 Research Decision Center":']
              for a in anchors:
                  if a in t:
                      t=t.replace(a,route+a,1)
                      break
              else: raise SystemExit("route anchor not found")
          p.write_text(t,encoding="utf-8")
      - name: Syntax check
        run: python -m py_compile app.py pages/40_Research_Activity_Version_History.py
      - name: Commit integration
        run: |
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate Research Activity Version History"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
