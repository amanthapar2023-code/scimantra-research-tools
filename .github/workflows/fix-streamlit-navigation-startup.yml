name: Fix Streamlit Startup Navigation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: streamlit-startup-navigation-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Isolate legacy Streamlit pages
        shell: bash
        run: |
          set -euo pipefail

          test -f app.py
          test -d pages
          mkdir -p pages/_legacy

          moved=0
          while IFS= read -r -d '' source; do
            name="$(basename "$source")"
            target="pages/_legacy/$name"
            if [[ -e "$target" ]]; then
              if ! cmp -s "$source" "$target"; then
                echo "ERROR: conflicting legacy page: $source vs $target"
                exit 1
              fi
              rm -f "$source"
            else
              mv "$source" "$target"
            fi
            moved=$((moved + 1))
          done < <(find pages -maxdepth 1 -type f -name '*.py' -print0)

          echo "Isolated $moved top-level Streamlit page script(s)."

      - name: Repair repository references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          skip = {'.git', '.venv', 'venv', '__pycache__'}
          exts = {'.py', '.yml', '.yaml', '.md', '.toml', '.txt', '.json', '.sh'}
          pattern = re.compile(r'pages/(?!_legacy/)')

          changed = 0
          for path in root.rglob('*'):
              if not path.is_file() or any(part in skip for part in path.parts):
                  continue
              if path.suffix.lower() not in exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = pattern.sub('pages/_legacy/', text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1

          print(f'Updated references in {changed} text file(s).')
          PY

      - name: Verify discovery boundary and syntax
        shell: bash
        run: |
          set -euo pipefail
          test -f app.py
          test -d pages/_legacy
          if find pages -maxdepth 1 -type f -name '*.py' | grep -q .; then
            echo 'ERROR: top-level pages/*.py still exist:'
            find pages -maxdepth 1 -type f -name '*.py' -print
            exit 1
          fi
          python -m py_compile app.py
          echo 'Streamlit discovery boundary is clean.'

      - name: Commit and push isolation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo 'No repository changes required.'
            exit 0
          fi

          git add -A
          git commit -m "Isolate legacy Streamlit pages from auto-discovery"
          git push origin HEAD:main
