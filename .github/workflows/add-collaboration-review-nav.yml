name: Add Research Collaboration Review Center

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Patch navigation and route
        shell: python
        run: |
          from pathlib import Path
          p=Path("app.py")
          t=p.read_text(encoding="utf-8")
          nav='("🤝 Research Collaboration & Review Center","nav_collaboration_review")'
          for anchor in ['("🕒 Research Activity & Version History","nav_version_history")','("🔍 Research Audit & Provenance Explorer","nav_audit_provenance")']:
              if nav not in t and anchor in t:
                  t=t.replace(anchor,anchor+',\n        '+nav,1)
                  break
          if nav not in t: raise SystemExit("navigation anchor not found")
          route='elif section=="🤝 Research Collaboration & Review Center":\n        import runpy\n        runpy.run_path("pages/41_Research_Collaboration_Review_Center.py")\n        st.stop()\n    '
          if 'pages/41_Research_Collaboration_Review_Center.py' not in t:
              for anchor in ['elif section=="🕒 Research Activity & Version History":','elif section=="🔍 Research Audit & Provenance Explorer":']:
                  if anchor in t:
                      t=t.replace(anchor,route+anchor,1)
                      break
              else: raise SystemExit("route anchor not found")
          p.write_text(t,encoding="utf-8")
      - name: Syntax check
        run: python -m py_compile app.py pages/41_Research_Collaboration_Review_Center.py
      - name: Commit integration
        run: |
          git add app.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate Research Collaboration Review Center"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
