name: Connect Manuscript Builder to Artifact Vault
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  integrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Integrate manuscript persistence
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          p=Path('pages/24_H2S_Complete_Manuscript_Builder.py')
          t=p.read_text(encoding='utf-8')
          if 'from src.scimantra.cloud import' not in t:
              t=t.replace('from src.scimantra.research_session import get_dataframe, metadata\n','from src.scimantra.research_session import get_dataframe, metadata\n')
              t=t.replace('import io\n','import io\nimport hashlib\nimport json\n')
              marker='st.warning("Scientific safeguard: this builder drafts data-derived text only. Add literature citations, verify units and replicate definitions, check assumptions, and perform confirmation experiments before making causal or optimization claims.")'
              block='''\n\n# Optional persistence: save the exact generated manuscript/evidence package to the authenticated project Vault.\ntry:\n    from src.scimantra.cloud import client, configured, upload_project_file, create_artifact\n    supa = client(st.secrets) if configured(st.secrets) else None\n    vault_user = supa.auth.get_user().user if supa else None\nexcept Exception:\n    supa = None\n    vault_user = None\n\nif supa and vault_user:\n    st.markdown("### ☁️ Research Project Vault")\n    projects = supa.table("projects").select("id,name").order("updated_at", desc=True).execute().data or []\n    if projects:\n        project_map = {x["name"]: x for x in projects}\n        project_name = st.selectbox("Save manuscript package to", list(project_map), key="manuscript_vault_project")\n        provenance = st.text_area("Vault provenance note", "Generated from the active H₂S dataset by SciMantra Complete Manuscript Builder.", key="manuscript_vault_note")\n        if st.button("☁️ Save manuscript + evidence workbook to Project Vault", type="primary"):\n            package = io.BytesIO()\n            import zipfile\n            with zipfile.ZipFile(package, "w", zipfile.ZIP_DEFLATED) as z:\n                z.writestr("manuscript.md", full)\n                z.writestr("evidence_workbook.xlsx", excel_bytes(tables))\n                z.writestr("manifest.json", json.dumps({"source":source,"rows":len(df),"analysis_units":n,"inlet":str(a),"outlet":str(b),"group":str(group),"replicate":str(rep),"time":str(time_col)}, indent=2))\n            data=package.getvalue(); digest=hashlib.sha256(data).hexdigest()\n            project_id=project_map[project_name]["id"]\n            storage_path=upload_project_file(supa,str(vault_user.id),project_id,"manuscript/h2s_manuscript_package.zip",data,"application/zip")\n            create_artifact(supa,str(vault_user.id),project_id,"h2s_manuscript_package.zip","manuscript",storage_path,"application/zip",len(data),digest,"H₂S Complete Manuscript Builder",{"note":provenance,"source":source,"analysis_units":n})\n            st.success("Manuscript package saved to the project Artifact Vault.")\n\n'''
              t=t.replace(marker, marker+block)
          t=t.replace('st.set_page_config(page_title="H₂S Complete Manuscript Builder", page_icon="📄", layout="wide")\n','')
          ast.parse(t); p.write_text(t,encoding='utf-8')
          print('Manuscript Vault integration validated.')
          PY
      - name: Commit and push safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/24_H2S_Complete_Manuscript_Builder.py
          git diff --cached --quiet || git commit -m 'Connect manuscript builder to research artifact vault'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
